name: Hourly quality pulse
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agentbridge-hourly-quality
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - name: Validate website and backend
        run: npm run ci
      - name: Write development pulse
        if: always()
        run: |
          mkdir -p reports
          printf 'AgentBridge hourly quality pulse\nRun: %s\nCommit: %s\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" > reports/hourly-pulse.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hourly-quality-pulse
          path: reports/
          retention-days: 3
# Hourly CI audits; code improvements are produced through a separate
# automated GitHub development task and offered as reviewable PRs.
