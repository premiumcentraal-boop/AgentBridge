name: Quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run ci
      # Private read-only stdio MCP server (separate lockfile; root CI stays dependency-free)
      - run: npm --prefix local-mcp ci --no-audit --no-fund
      - run: npm --prefix local-mcp test
      - name: Upload static website
        uses: actions/upload-artifact@v4
        with:
          name: agentbridge-static
          path: dist/
          retention-days: 7
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (pinned binary, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git . --redact --no-banner
          ./gitleaks dir . --redact --no-banner
