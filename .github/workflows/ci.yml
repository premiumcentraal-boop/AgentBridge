name: Quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run ci
      - name: Upload static website
        uses: actions/upload-artifact@v4
        with:
          name: agentbridge-static
          path: dist/
          retention-days: 7
