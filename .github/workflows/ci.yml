name: Quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      # Private read-only stdio MCP server (separate lockfile)
      - run: npm --prefix local-mcp ci --no-audit --no-fund
      - run: npm --prefix local-mcp test
      - name: Upload static website
        uses: actions/upload-artifact@v4
        with:
          name: agentbridge-static
          path: dist/
          retention-days: 7
      - name: Upload working HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: agentbridge-working-preview
          path: web/.cache/AgentBridge-Working-Website.html
          retention-days: 7
